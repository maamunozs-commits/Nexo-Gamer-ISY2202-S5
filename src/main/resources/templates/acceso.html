<!doctype html>
<html lang="es-CL" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{componentes :: cabecera('Iniciar sesión')}"></head>
<body>
<header th:replace="~{componentes :: navegacion('acceso')}"></header>
<main class="ancho pagina pagina-acceso" id="contenido">
    <section class="acceso-panel" aria-labelledby="titulo-acceso">
        <p class="rotulo">Cuenta Nexo Gamer</p>
        <h1 id="titulo-acceso">Iniciar sesión</h1>
        <p class="bajada">Ingresa con tu cuenta para consultar la ficha completa de los eventos.</p>
        <p class="mensaje-error" role="alert" th:if="${param.error}">Correo o contraseña incorrectos.</p>
        <form th:action="@{/eventos/acceso}" method="post">
            <label for="correo">Correo electrónico
                <input type="email" id="correo" name="correo" maxlength="160" required autocomplete="username">
            </label>
            <label for="clave">Contraseña
                <input type="password" id="clave" name="clave" maxlength="72" required autocomplete="current-password">
            </label>
            <button type="submit" class="boton boton-principal">Entrar</button>
        </form>
        <a class="enlace-detalle" th:href="@{/eventos/buscar}">Volver al catálogo</a>
    </section>
    <div class="acceso-imagen" aria-hidden="true"></div>
</main>
<footer th:replace="~{componentes :: pie}"></footer>
</body>
</html>
