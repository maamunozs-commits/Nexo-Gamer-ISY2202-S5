spring.application.name=nexo-gamer
spring.datasource.url=${URL_BD:jdbc:mysql://localhost:3306/eventos_gamer}
spring.datasource.username=${USUARIO_BD:eventos}
spring.datasource.password=${CLAVE_BD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.forward-headers-strategy=${CABECERAS_PROXY:none}
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIES_SEGURAS:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
nexo.clave-jwt=${CLAVE_JWT}
nexo.enlace-publico=${ENLACE_PUBLICO:http://localhost:8090}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
